<title>錢錢抱歉 · 批次遮罩</title>

<!-- ══ 零網路自我檢查：必須是第一支 script ══
     整個工具在執行期不應發出任何網路請求。這裡把三個出口都包成 throw，
     任何一次呼叫都會被記錄並在介面上明確報錯，而不是靜默地連出去。 -->
<script>
window.__NET_CALLS = [];
(function () {
  const log = (kind, target) => {
    const entry = kind + ': ' + String(target);
    window.__NET_CALLS.push(entry);
    throw new Error('此工具不應發出網路請求 — ' + entry);
  };
  window.fetch = function () { log('fetch', arguments[0]); };
  const _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) { log('XHR', u); };
  const _WS = window.WebSocket;
  window.WebSocket = function (u) { log('WebSocket', u); };
  if (navigator.sendBeacon) navigator.sendBeacon = function (u) { log('sendBeacon', u); return false; };
})();
</script>

      <kbd>Delete</kbd> 刪除選取的框 · <kbd>Enter</kbd> 標記已處理並跳下一張待處理 · <kbd>↑</kbd><kbd>↓</kbd> 切換

<script>__TFJS__</script>
<script>__CORE__</script>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════════
// 內嵌資產（由 build-censor.js 置換）
// ══════════════════════════════════════════════════════════════════════
const MODEL_TOPOLOGY = __MODEL_TOPOLOGY__;
const WEIGHT_SPECS   = __WEIGHT_SPECS__;
const SIGNATURE      = __SIGNATURE__;
const WEIGHTS_B64    = "__WEIGHTS_B64__";
const MODEL_INPUT    = __MODEL_INPUT__;   // MoveNet Thunder = 256

// ══════════════════════════════════════════════════════════════════════
// 演算法核心來自 src/censor-core.js（同一份程式碼也被 tools/verify 使用）
// ══════════════════════════════════════════════════════════════════════
const { analyze, restoreKeypoints, padGeometry } = CensorCore;

// ══════════════════════════════════════════════════════════════════════
// 推論：置中 pad 成正方形 → resize 到模型輸入 → int32（不做正規化）
// ══════════════════════════════════════════════════════════════════════
let MODEL = null;

// 前處理走 tf 張量路徑（pad → resizeBilinear），不用 canvas 縮放。
// canvas 的 drawImage 降採樣用的濾波與 resizeBilinear 不同，實測會讓關鍵點信心
// 出現足以改變分級的偏移（有兩張因此被誤判為結構不合理）。
function detect(bitmap) {
  const w = bitmap.width, h = bitmap.height;
  const geo = padGeometry(w, h, MODEL_INPUT);
  const raw = tf.tidy(() => {
    const img = tf.browser.fromPixels(bitmap);
    const sq = img.pad([[geo.padY, geo.padBottom], [geo.padX, geo.padRight], [0, 0]]);
    const input = tf.image.resizeBilinear(sq, [MODEL_INPUT, MODEL_INPUT]).toInt().expandDims(0);
    return MODEL.execute(input).arraySync()[0][0];       // [17][3] = y, x, score
  });
  return restoreKeypoints(raw, w, h, MODEL_INPUT);
}

// 回歸驗證掛勾：tools/verify 透過 CDP 呼叫這裡，測到的就是實際會執行的管線。
// 純讀取、不改變任何狀態，對一般使用沒有影響。
window.__censorTest = {
  ready: () => !!MODEL,
  backend: () => tf.getBackend(),
  netCalls: () => window.__NET_CALLS.slice(),
  async run(name, b64) {
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const bmp = await createImageBitmap(new Blob([u]), { imageOrientation: 'from-image' });
    try {
      const t0 = performance.now();
      const kps = detect(bmp);
      const ms = performance.now() - t0;
      const r = analyze(kps, bmp.width, bmp.height);
      return { name, w: bmp.width, h: bmp.height, ms: +ms.toFixed(1), grade: r.grade, reason: r.reason,
               ori: r.ori, mode: r.mode, mLeg: r.mLeg, masks: r.masks,
               kp: kps.map(p => +p.s.toFixed(3)),
               overlay: drawOverlay(bmp, kps, r.masks) };
    } finally { bmp.close(); }
  },
};

function drawOverlay(bmp, kps, masks) {
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const x = c.getContext('2d');
  x.drawImage(bmp, 0, 0);
  const t = Math.max(2, Math.round(Math.min(c.width, c.height) / 250));
  x.lineWidth = t;
  masks.forEach((m, i) => {
    x.fillStyle = 'rgba(0,0,0,.55)';
    x.fillRect(m.x0, m.y0, m.x1 - m.x0, m.y1 - m.y0);
    x.strokeStyle = i === 0 ? '#ff00ff' : '#00ffff';
    x.strokeRect(m.x0, m.y0, m.x1 - m.x0, m.y1 - m.y0);
  });
  kps.forEach(p => {
    x.fillStyle = p.s >= 0.5 ? '#00ff00' : p.s >= 0.3 ? '#ffd400' : '#ff2020';
    x.beginPath(); x.arc(p.x, p.y, t * 1.8, 0, 7); x.fill();
  });
  x.fillStyle = masks.length ? '#00c000' : '#d00000';
  x.fillRect(0, 0, c.width * 0.1, Math.max(6, c.height * 0.02));
  return c.toDataURL('image/jpeg', 0.75);
}

// ══════════════════════════════════════════════════════════════════════
// store-only ZIP（零依賴，與 index.html 同一套規格）
// ══════════════════════════════════════════════════════════════════════
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// DOS 時間戳：ZIP 的 local header 與 central directory 各有一組。
// 不填會變成 1980-01-01 00:00（date 欄的 0x21 就是 year=0/month=1/day=1）。
function dosDateTime(d) {
  const year = Math.max(1980, d.getFullYear());
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((year - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
  };
}

function makeZip(entries) {
  const enc = new TextEncoder();
  const { time, date } = dosDateTime(new Date());
  const parts = [], central = [];
  let offset = 0;

  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.bytes);
    const size = e.bytes.length;

    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);         // version needed
    lv.setUint16(6, 0x0800, true);     // flag bit 11：檔名為 UTF-8（中文檔名需要）
    lv.setUint16(8, 0, true);          // method 0 = store
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);         // extra field length
    lh.set(name, 30);
    parts.push(lh, e.bytes);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);         // version made by
    cv.setUint16(6, 20, true);         // version needed
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);         // method
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);         // extra
    cv.setUint16(32, 0, true);         // comment
    cv.setUint16(34, 0, true);         // disk number start
    cv.setUint16(36, 0, true);         // internal attrs
    cv.setUint32(38, 0, true);         // external attrs
    cv.setUint32(42, offset, true);    // local header offset
    ch.set(name, 46);
    central.push(ch);

    offset += lh.length + size;
  }

  const cdOffset = offset;
  let cdSize = 0;
  for (const c of central) { parts.push(c); cdSize += c.length; }

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdOffset, true);
  parts.push(eocd);

  return new Blob(parts, { type: 'application/zip' });
}

// ══════════════════════════════════════════════════════════════════════
// 狀態
// ══════════════════════════════════════════════════════════════════════
const items = [];          // { file, name, w, h, thumb, grade, reason, masks[], done, error }
let cur = -1;              // 目前檢視的索引
let selMask = -1;          // 目前選取的遮罩索引

const $ = id => document.getElementById(id);
const els = {
  boot: $('boot'), drop: $('drop'), wrap: $('canvasWrap'), hint: $('hint'),
  list: $('list'), cv: $('cv'), status: $('status'), lockNote: $('lockNote'),
  exportBtn: $('export'), tally: $('tally'), nG: $('nG'), nY: $('nY'), nR: $('nR'),
};
const ctx = els.cv.getContext('2d');

// ══════════════════════════════════════════════════════════════════════
// 啟動：從內嵌 base64 載入模型（零 fetch）
// ══════════════════════════════════════════════════════════════════════
function b64ToArrayBuffer(b64) {
  const bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

(async function boot() {
  const t0 = performance.now();
  try {
    await tf.setBackend('webgl');
    await tf.ready();
  } catch (e) { /* 落到下面的 backend 檢查 */ }

  const backend = tf.getBackend();
  let warn = '';
  if (backend !== 'webgl') {
    // 不靜默降速：CPU backend 慢一到兩個數量級，使用者有權先知道
    warn = '<div class="warn">⚠ 這個環境沒有可用的 WebGL，backend 退回 <b>' + backend + '</b>。' +
           '推論會慢上一到兩個數量級（100 張可能需要數十分鐘）。<br>' +
           '建議改用支援硬體加速的瀏覽器；仍可繼續使用，但請預期等待。</div>';
  }

  try {
    MODEL = await tf.loadGraphModel(tf.io.fromMemory({
      modelTopology: MODEL_TOPOLOGY,
      weightSpecs: WEIGHT_SPECS,
      weightData: b64ToArrayBuffer(WEIGHTS_B64),
      format: 'graph-model',
      signature: SIGNATURE,
    }));
  } catch (e) {
    els.boot.innerHTML = '<div class="bad">模型載入失敗：' + e.message + '</div>';
    return;
  }

  const net = window.__NET_CALLS.length;
  els.boot.innerHTML = warn +
    '<div>模型就緒 · backend <b>' + backend + '</b> · ' +
    ((performance.now() - t0) / 1000).toFixed(1) + ' 秒 · ' +
    (net === 0 ? '網路呼叫 0 次' : '<span class="bad">偵測到 ' + net + ' 次網路呼叫：' +
      window.__NET_CALLS.join('、') + '</span>') + '</div>';
  els.drop.classList.remove('hidden');
})();

// ══════════════════════════════════════════════════════════════════════
// 檔案選取
// ══════════════════════════════════════════════════════════════════════
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) load(f); };

document.addEventListener('dragover', e => { e.preventDefault(); els.drop.classList.add('over'); });
document.addEventListener('dragleave', e => { if (e.target === document.documentElement) els.drop.classList.remove('over'); });
document.addEventListener('drop', e => {
  e.preventDefault(); els.drop.classList.remove('over');
  const f = [...e.dataTransfer.files].filter(x => /^image\//.test(x.type) || /\.(jpe?g|png|webp|gif|bmp|heic)$/i.test(x.name));
  if (f.length) load(f);
});

async function load(files) {
  if (!MODEL) return;
  items.length = 0; cur = -1; selMask = -1;
  els.list.innerHTML = '';
  els.drop.classList.add('hidden');
  els.boot.classList.add('hidden');
  els.tally.classList.remove('hidden');

  for (const file of files) {
    items.push({ file, name: file.name, w: 0, h: 0, thumb: '', masks: [],
                 grade: 'PENDING', reason: '', done: false, error: '' });
  }
  render();

  // 逐張序列處理：每張跑完立刻釋放 bitmap，避免大批次耗盡記憶體
  const t0 = performance.now();
  for (let i = 0; i < items.length; i++) {
    els.status.textContent = '處理中 ' + (i + 1) + ' / ' + items.length;
    await process(items[i]);
    renderRow(i);
    updateTally();
    if (i % 4 === 0) await new Promise(r => setTimeout(r, 0));   // 讓出主執行緒，介面才會更新
  }
  els.status.textContent = items.length + ' 張 · 偵測耗時 ' + ((performance.now() - t0) / 1000).toFixed(1) + ' 秒';
  updateTally();
  const first = items.findIndex(it => !it.error && !it.done);
  select(first >= 0 ? first : items.findIndex(it => !it.error));
}

async function process(it) {
  let bmp = null;
  try {
    bmp = await createImageBitmap(it.file, { imageOrientation: 'from-image' });
  } catch (e) {
    it.error = /heic/i.test(it.name) ? '此瀏覽器無法解碼 HEIC，請改用 Safari 開啟' : '無法解碼此檔案';
    it.grade = 'ERROR';
    return;
  }
  try {
    it.w = bmp.width; it.h = bmp.height;

    const r = analyze(detect(bmp), it.w, it.h);
    it.grade = r.grade;
    if (r.grade === 'RED') {
      it.reason = r.reason; it.masks = []; it.done = false;
    } else {
      it.masks = r.masks; it.ori = r.ori; it.mode = r.mode;
      it.reason = (r.ori === 'front' ? '正面' : r.ori === 'back' ? '背面' : '側面') +
                  (r.mode === 'bust' ? ' · 半身模式' : '') + (r.mLeg ? ' · M字腿' : '');
      it.done = true;               // 🟢🟡 預設已處理，使用者仍可調整；只有 🔴 會鎖住輸出
    }

    // 縮圖留下來給清單用，原始 bitmap 立刻釋放
    const t = document.createElement('canvas');
    const s = 80 / Math.max(it.w, it.h);
    t.width = Math.max(1, Math.round(it.w * s)); t.height = Math.max(1, Math.round(it.h * s));
    t.getContext('2d').drawImage(bmp, 0, 0, t.width, t.height);
    it.thumb = t.toDataURL('image/jpeg', 0.6);
  } catch (e) {
    it.grade = 'RED'; it.reason = '偵測失敗：' + e.message; it.masks = []; it.done = false;
  } finally {
    if (bmp) bmp.close();
  }
}

// ══════════════════════════════════════════════════════════════════════
// 清單
// ══════════════════════════════════════════════════════════════════════
const BADGE = { GREEN: '🟢', YELLOW: '🟡', RED: '🔴', ERROR: '⛔', PENDING: '…' };

function render() {
  els.list.innerHTML = '';
  items.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'item'; d.dataset.i = i;
    d.onclick = () => select(i);
    els.list.appendChild(d);
    renderRow(i);
  });
}
function renderRow(i) {
  const it = items[i];
  const d = els.list.querySelector('.item[data-i="' + i + '"]');
  if (!d) return;
  d.className = 'item' + (i === cur ? ' sel' : '') + (it.done ? ' done' : '');
  d.innerHTML =
    '<span class="badge">' + BADGE[it.grade] + '</span>' +
    (it.thumb ? '<img src="' + it.thumb + '" alt="">' : '<img alt="">') +
    '<div class="meta"><div class="name"></div><div class="sub"></div></div>';
  d.querySelector('.name').textContent = it.name;
  d.querySelector('.sub').textContent =
    it.error ? it.error
    : it.grade === 'PENDING' ? '待處理'
    : it.grade === 'RED'
      ? (it.masks.length ? '手動 ' + it.masks.length + ' 個遮罩' : it.reason)
      : it.reason + ' · ' + it.masks.length + ' 個遮罩';
}
function updateTally() {
  const n = g => items.filter(it => it.grade === g).length;
  els.nG.textContent = n('GREEN'); els.nY.textContent = n('YELLOW'); els.nR.textContent = n('RED');

  const pending = items.filter(it => it.grade === 'RED' && !it.done).length;
  const usable = items.filter(it => !it.error).length;
  els.exportBtn.disabled = pending > 0 || usable === 0;
  els.lockNote.textContent = pending > 0 ? '尚有 ' + pending + ' 張需處理，輸出已鎖定' : '';
}

// ══════════════════════════════════════════════════════════════════════
// 編輯區
// ══════════════════════════════════════════════════════════════════════
let view = null;   // { bmp, scale }

async function select(i) {
  if (i < 0 || i >= items.length) return;
  cur = i; selMask = -1;
  [...els.list.children].forEach((el, j) => renderRow(j));
  els.list.querySelector('.item[data-i="' + i + '"]')?.scrollIntoView({ block: 'nearest' });

  const it = items[i];
  if (view?.bmp) { view.bmp.close(); view = null; }
  if (it.error) { els.wrap.classList.add('hidden'); els.hint.classList.add('hidden'); return; }

  els.wrap.classList.remove('hidden'); els.hint.classList.remove('hidden');
  const bmp = await createImageBitmap(it.file, { imageOrientation: 'from-image' });
  if (cur !== i) { bmp.close(); return; }                 // 期間又切走了，丟棄
  const box = els.wrap.getBoundingClientRect();
  const scale = Math.min((box.width - 32) / bmp.width, (box.height - 32) / bmp.height, 1);
  view = { bmp, scale };
  els.cv.width = Math.round(bmp.width * scale);
  els.cv.height = Math.round(bmp.height * scale);
  draw();
}

function draw() {
  if (!view || cur < 0) return;
  const it = items[cur], s = view.scale;
  ctx.clearRect(0, 0, els.cv.width, els.cv.height);
  ctx.drawImage(view.bmp, 0, 0, els.cv.width, els.cv.height);
  it.masks.forEach((m, i) => {
    const x = m.x0 * s, y = m.y0 * s, w = (m.x1 - m.x0) * s, h = (m.y1 - m.y0) * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = i === selMask ? '#6ea8fe' : 'rgba(255,255,255,.45)';
    ctx.lineWidth = i === selMask ? 2 : 1;
    ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    if (i === selMask) {
      ctx.fillStyle = '#6ea8fe';
      for (const [hx, hy] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]])
        ctx.fillRect(hx - 4, hy - 4, 8, 8);
    }
  });
}

const HANDLE = 9;
let drag = null;

function toImg(ev) {
  const r = els.cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / view.scale, y: (ev.clientY - r.top) / view.scale };
}
function handleAt(m, p) {
  const t = HANDLE / view.scale;
  const corners = [['x0','y0'], ['x1','y0'], ['x0','y1'], ['x1','y1']];
  for (const [cx, cy] of corners)
    if (Math.abs(p.x - m[cx]) < t && Math.abs(p.y - m[cy]) < t) return [cx, cy];
  return null;
}

els.cv.addEventListener('pointerdown', ev => {
  if (!view || cur < 0) return;
  els.cv.setPointerCapture(ev.pointerId);
  const it = items[cur], p = toImg(ev);

  if (selMask >= 0 && it.masks[selMask]) {
    const h = handleAt(it.masks[selMask], p);
    if (h) { drag = { mode: 'resize', i: selMask, corner: h }; return; }
  }
  for (let i = it.masks.length - 1; i >= 0; i--) {
    const m = it.masks[i];
    if (p.x >= m.x0 && p.x <= m.x1 && p.y >= m.y0 && p.y <= m.y1) {
      selMask = i; drag = { mode: 'move', i, ox: p.x - m.x0, oy: p.y - m.y0 };
      draw(); return;
    }
  }
  it.masks.push({ x0: p.x, y0: p.y, x1: p.x, y1: p.y });
  selMask = it.masks.length - 1;
  drag = { mode: 'new', i: selMask, ax: p.x, ay: p.y };
  draw();
});

els.cv.addEventListener('pointermove', ev => {
  if (!drag || !view) return;
  const it = items[cur], m = it.masks[drag.i], p = toImg(ev);
  const cx = v => Math.max(0, Math.min(it.w, v)), cy = v => Math.max(0, Math.min(it.h, v));
  if (drag.mode === 'new') {
    m.x0 = cx(Math.min(drag.ax, p.x)); m.x1 = cx(Math.max(drag.ax, p.x));
    m.y0 = cy(Math.min(drag.ay, p.y)); m.y1 = cy(Math.max(drag.ay, p.y));
  } else if (drag.mode === 'move') {
    const w = m.x1 - m.x0, h = m.y1 - m.y0;
    m.x0 = cx(Math.min(p.x - drag.ox, it.w - w)); m.x1 = m.x0 + w;
    m.y0 = cy(Math.min(p.y - drag.oy, it.h - h)); m.y1 = m.y0 + h;
  } else {
    m[drag.corner[0]] = cx(p.x); m[drag.corner[1]] = cy(p.y);
  }
  draw();
});

els.cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const it = items[cur], m = it.masks[drag.i];
  if (m.x1 < m.x0) [m.x0, m.x1] = [m.x1, m.x0];         // 反向拖曳正規化
  if (m.y1 < m.y0) [m.y0, m.y1] = [m.y1, m.y0];
  if ((m.x1 - m.x0) < 4 || (m.y1 - m.y0) < 4) {         // 太小視為誤觸
    it.masks.splice(drag.i, 1); selMask = -1;
  }
  drag = null;
  renderRow(cur); draw();
});

document.addEventListener('keydown', ev => {
  if (cur < 0 || ev.metaKey || ev.ctrlKey) return;
  const it = items[cur];
  if (ev.key === 'Delete' || ev.key === 'Backspace') {
    if (selMask >= 0) { it.masks.splice(selMask, 1); selMask = -1; renderRow(cur); draw(); ev.preventDefault(); }
  } else if (ev.key === 'Enter') {
    it.done = true;                                      // 沒有任何遮罩也可以標記已處理 = 這張不需要遮
    renderRow(cur); updateTally();
    const next = items.findIndex(x => !x.error && !x.done);
    if (next >= 0) select(next);
    ev.preventDefault();
  } else if (ev.key === 'ArrowDown') {
    for (let i = cur + 1; i < items.length; i++) if (!items[i].error) { select(i); break; }
    ev.preventDefault();
  } else if (ev.key === 'ArrowUp') {
    for (let i = cur - 1; i >= 0; i--) if (!items[i].error) { select(i); break; }
    ev.preventDefault();
  }
});

// ══════════════════════════════════════════════════════════════════════
// 輸出：masked/（已遮，維持來源尺寸）+ raw/（位元組層級原檔）
// ══════════════════════════════════════════════════════════════════════
const outCv = document.createElement('canvas');
const outCtx = outCv.getContext('2d');

async function renderMasked(file, masks) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  try {
    outCv.width = bmp.width; outCv.height = bmp.height;   // 維持來源尺寸，不裁切不縮放
    outCtx.fillStyle = '#fff';                            // 白底：去背 PNG 轉 JPEG 才不會變黑
    outCtx.fillRect(0, 0, outCv.width, outCv.height);
    outCtx.drawImage(bmp, 0, 0);
    outCtx.fillStyle = '#000';
    for (const m of masks) outCtx.fillRect(m.x0, m.y0, m.x1 - m.x0, m.y1 - m.y0);
    return await new Promise(r => outCv.toBlob(r, 'image/jpeg', 0.92));
  } finally { bmp.close(); }
}

function uniqueName(used, name) {
  if (!used.has(name)) { used.add(name); return name; }
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  for (let n = 2; ; n++) {
    const cand = stem + '-' + n + ext;
    if (!used.has(cand)) { used.add(cand); return cand; }
  }
}

els.exportBtn.onclick = async () => {
  els.exportBtn.disabled = true;
  const usable = items.filter(it => !it.error);
  const entries = [], used = new Set();
  try {
    for (let i = 0; i < usable.length; i++) {
      const it = usable[i];
      els.status.textContent = '輸出中 ' + (i + 1) + ' / ' + usable.length;
      const stem = it.name.replace(/\.[^.]+$/, '');
      const blob = await renderMasked(it.file, it.masks);
      entries.push({ name: 'masked/' + uniqueName(used, stem + '-masked.jpg'),
                     bytes: new Uint8Array(await blob.arrayBuffer()) });
      // raw 是位元組層級複製：不經 canvas、不重新編碼，雜湊與來源檔一致
      entries.push({ name: 'raw/' + uniqueName(used, it.name),
                     bytes: new Uint8Array(await it.file.arrayBuffer()) });
      if (i % 4 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
    const url = URL.createObjectURL(makeZip(entries));
    const a = document.createElement('a');
    a.href = url; a.download = 'money-sorry-censored-' + stamp + '.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    const failed = items.length - usable.length;
    els.status.textContent = usable.length + ' 張已打包' + (failed ? '，' + failed + ' 個失敗' : '');
  } catch (e) {
    els.status.textContent = '輸出失敗：' + e.message;
  }
  updateTally();
};

// 輸出路徑的回歸驗證掛勾：跑的是真正的 renderMasked / uniqueName / makeZip
window.__censorTest.buildZip = async function (inputs) {
  const entries = [], used = new Set();
  for (const inp of inputs) {
    const bin = atob(inp.b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const file = new File([u], inp.name);
    const bmp = await createImageBitmap(file);
    const masks = analyze(detect(bmp), bmp.width, bmp.height).masks;
    const dims = { w: bmp.width, h: bmp.height };
    bmp.close();
    const stem = inp.name.replace(/\.[^.]+$/, '');
    const blob = await renderMasked(file, masks);
    const out = await createImageBitmap(blob);
    const outDims = { w: out.width, h: out.height };
    out.close();
    entries.push({ name: 'masked/' + uniqueName(used, stem + '-masked.jpg'),
                   bytes: new Uint8Array(await blob.arrayBuffer()), dims: dims, outDims: outDims });
    entries.push({ name: 'raw/' + uniqueName(used, inp.name),
                   bytes: new Uint8Array(await file.arrayBuffer()) });
  }
  const zip = await makeZip(entries.map(e => ({ name: e.name, bytes: e.bytes }))).arrayBuffer();
  let bin = '';
  const u8 = new Uint8Array(zip);
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return {
    zip: btoa(bin),
    names: entries.map(e => e.name),
    dims: entries.filter(e => e.dims).map(e => ({ name: e.name, src: e.dims, out: e.outDims })),
  };
};

window.addEventListener('resize', () => { if (cur >= 0) select(cur); });
</script>
</html>
